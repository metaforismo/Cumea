name: Complete P0.11a TODO

on:
  push:
    branches:
      - perf/transcript-search-index
    paths:
      - scripts/complete-p011a-todo.mjs
      - .github/workflows/complete-p011a-todo.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/transcript-search-index
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/complete-p011a-todo.mjs
      - name: Verify and commit
        shell: bash
        run: |
          grep -F -- '- [x] P0.11a — Add the owner-local derived SQLite/WAL search projection' TODO.md
          grep -F 'Completed the owner-local derived transcript search index' TODO.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md
          git commit -m "docs: mark P0.11a transcript search complete"
          git push origin HEAD:perf/transcript-search-index
