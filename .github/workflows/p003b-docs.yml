name: P0.03b docs update

on:
  push:
    branches:
      - perf/harness-ready-handshake
    paths:
      - .github/workflows/p003b-docs.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/harness-ready-handshake
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Apply asserted documentation update
        run: node scripts/apply-p003b-docs.mjs
      - name: Remove the one-time helper
        shell: bash
        run: |
          git rm scripts/apply-p003b-docs.mjs .github/workflows/p003b-docs.yml
          git diff --check
      - name: Commit final documentation to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md CHANGELOG.md docs/desktop-startup.md docs/performance.md
          git commit -m "docs: record OS-assigned harness readiness"
          git push origin HEAD:perf/harness-ready-handshake
