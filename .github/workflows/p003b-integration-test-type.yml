name: P0.03b integration test type fix

on:
  push:
    branches:
      - perf/harness-ready-handshake
    paths:
      - .github/workflows/p003b-integration-test-type.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/harness-ready-handshake
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/apply-p003b-integration-test-type.mjs
      - name: Remove one-time helper and commit
        shell: bash
        run: |
          git rm scripts/apply-p003b-integration-test-type.mjs .github/workflows/p003b-integration-test-type.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/local-listener.integration.test.ts
          git commit -m "test: use exact harness child stdio type"
          git push origin HEAD:perf/harness-ready-handshake
