name: P0.11a error boundaries

on:
  push:
    branches:
      - perf/transcript-search-index
    paths:
      - scripts/fix-p011a-error-boundaries.mjs
      - .github/workflows/p011a-error-boundaries.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/transcript-search-index
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/fix-p011a-error-boundaries.mjs
      - name: Verify and commit
        shell: bash
        run: |
          grep -F 'SQLite failures' server/message-search-index.ts
          grep -F 'no such module:\s*fts5' server/message-search-index.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/message-search-index.ts
          git commit -m "fix: distinguish transcript parse and SQLite failures"
          git push origin HEAD:perf/transcript-search-index
