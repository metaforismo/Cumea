name: Update canonical deletion tests

on:
  push:
    branches:
      - perf/canonical-transcript-activation
    paths:
      - scripts/update-canonical-index-delete-tests.mjs
      - .github/workflows/update-canonical-index-delete-tests.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/canonical-transcript-activation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/update-canonical-index-delete-tests.mjs
      - name: Verify and commit
        shell: bash
        run: |
          grep -F 'restores canonical state' server/index.test.ts
          grep -F 'import { TranscriptStore }' server/index.test.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.test.ts
          git commit -m "test: migrate deletion rollback cases to canonical transcripts"
          git push origin HEAD:perf/canonical-transcript-activation
