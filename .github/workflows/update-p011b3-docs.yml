name: Update P0.11b3 docs

on:
  push:
    branches:
      - perf/canonical-transcript-activation
    paths:
      - scripts/update-p011b3-docs.mjs
      - .github/workflows/update-p011b3-docs.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/canonical-transcript-activation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/update-p011b3-docs.mjs
      - name: Verify and commit
        shell: bash
        run: |
          grep -F -- '- [x] P0.11b3 — Integrate' TODO.md
          grep -F 'Activated canonical transcript persistence' CHANGELOG.md
          grep -F 'production harness' README.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TODO.md CHANGELOG.md
          git commit -m "docs: mark canonical transcript activation complete"
          git push origin HEAD:perf/canonical-transcript-activation
