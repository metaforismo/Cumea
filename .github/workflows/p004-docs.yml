name: P0.04 docs

on:
  push:
    branches:
      - perf/atomic-bootstrap-v2
    paths:
      - scripts/update-p004-docs.mjs
      - .github/workflows/p004-docs.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/atomic-bootstrap-v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/update-p004-docs.mjs
      - name: Commit docs
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TODO.md CHANGELOG.md
          git commit -m "docs: track atomic desktop bootstrap"
          git push origin HEAD:perf/atomic-bootstrap-v2
