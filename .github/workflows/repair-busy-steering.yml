name: Repair busy steering transform

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/busy-user-steering' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/busy-user-steering
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Repair and syntax-check transform
        run: |
          node scripts/repair-busy-steering-transform.mjs
          node --check scripts/apply-busy-steering.mjs
      - name: Apply product integration
        run: node scripts/apply-busy-steering.mjs
      - name: Remove all one-shot machinery and restore normal CI
        run: |
          rm -f \
            scripts/apply-busy-steering.mjs \
            scripts/repair-busy-steering-transform.mjs \
            .github/workflows/repair-busy-steering.yml
          git checkout origin/main -- .github/workflows/ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire bounded attended busy steering"
          git push origin HEAD:feat/busy-user-steering
