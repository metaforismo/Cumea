name: Apply safe file previews

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/safe-file-previews' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/safe-file-previews
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: node --check scripts/apply-safe-file-previews.mjs
      - run: node scripts/apply-safe-file-previews.mjs
      - name: Update current lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit product integration and remove one-shot machinery
        run: |
          rm -f scripts/apply-safe-file-previews.mjs .github/workflows/apply-safe-file-previews.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire safe local file previews"
          git push origin HEAD:feat/safe-file-previews
