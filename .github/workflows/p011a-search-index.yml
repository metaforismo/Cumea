name: P0.11a transcript search index

on:
  push:
    branches:
      - perf/transcript-search-index
    paths:
      - scripts/apply-p011a-search-index.mjs
      - .github/workflows/p011a-search-index.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/transcript-search-index
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/apply-p011a-search-index.mjs
      - name: Verify and commit
        shell: bash
        run: |
          grep -F 'new MessageSearchIndex()' server/store.ts
          grep -F 'path === "/api/search/messages"' server/index.ts
          grep -F 'indexed transcript deletion cannot be guaranteed' server/store.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/message-search-index.ts server/store.ts server/index.ts
          git commit -m "perf: wire owner-local transcript search index"
          git push origin HEAD:perf/transcript-search-index
