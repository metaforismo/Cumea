name: P0.11a search hardening

on:
  push:
    branches:
      - perf/transcript-search-index
    paths:
      - scripts/harden-p011a-search-index.mjs
      - .github/workflows/p011a-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/transcript-search-index
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/harden-p011a-search-index.mjs
      - name: Verify and commit
        shell: bash
        run: |
          grep -F 'PRAGMA secure_delete=ON' server/message-search-index.ts
          grep -F 'wal_checkpoint(TRUNCATE)' server/message-search-index.ts
          grep -F 'const transcriptSnapshot = [...this.messagesFor(bot.threadId)]' server/store.ts
          grep -F '{ messageSearch: true }' server/index.ts
          grep -F 'store.close();' server/index.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/message-search-index.ts server/store.ts server/index.ts
          git commit -m "fix: harden derived transcript search lifecycle"
          git push origin HEAD:perf/transcript-search-index
