name: P0.11a docs

on:
  push:
    branches:
      - perf/transcript-search-index
    paths:
      - scripts/update-p011a-docs.mjs
      - .github/workflows/p011a-docs.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/transcript-search-index
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/update-p011a-docs.mjs
      - name: Verify and commit
        shell: bash
        run: |
          grep -F -- '- [~] **P0.11 — Incremental transcript persistence and local search index.**' TODO.md
          grep -F 'P0.11b — Migrate the canonical transcript source of truth' TODO.md
          grep -F 'docs/transcript-search.md' README.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TODO.md CHANGELOG.md
          git commit -m "docs: define the P0.11 transcript migration boundary"
          git push origin HEAD:perf/transcript-search-index
