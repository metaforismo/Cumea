name: P0.03b listener refactor

on:
  push:
    branches:
      - perf/harness-ready-handshake
    paths:
      - .github/workflows/p003b-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/harness-ready-handshake
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Apply asserted source transformation
        run: node scripts/apply-p003b-server-refactor.mjs
      - name: Verify generated diff
        shell: bash
        run: |
          git diff --check
          git diff --exit-code --quiet -- server/index.ts && {
            echo "server/index.ts did not change" >&2
            exit 1
          }
      - name: Commit listener refactor to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts
          git commit -m "perf: bind harness on its actual local port"
          git push origin HEAD:perf/harness-ready-handshake
