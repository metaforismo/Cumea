name: Complete P0.04 TODO

on:
  push:
    branches:
      - perf/atomic-bootstrap-v2
    paths:
      - scripts/complete-p004-todo.mjs
      - .github/workflows/complete-p004-todo.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/atomic-bootstrap-v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/complete-p004-todo.mjs
      - name: Verify and commit
        shell: bash
        run: |
          grep -F -- '- [x] **P0.04 — Atomic bootstrap.**' TODO.md
          grep -F '| 2026-08-18 | P0.04 |' TODO.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md
          git commit -m "docs: mark atomic bootstrap complete"
          git push origin HEAD:perf/atomic-bootstrap-v2
