name: Harden file capability roots

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/safe-file-previews' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/safe-file-previews
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node --check scripts/harden-file-capability-roots.mjs
      - run: node scripts/harden-file-capability-roots.mjs
      - name: Commit hardened product diff
        run: |
          rm -f scripts/harden-file-capability-roots.mjs .github/workflows/harden-file-capability-roots.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: reject managed file-root symlinks"
          git push origin HEAD:feat/safe-file-previews
