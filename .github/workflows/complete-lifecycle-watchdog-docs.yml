name: Complete lifecycle watchdog docs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.ref == 'fix/agent-lifecycle-watchdog' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/agent-lifecycle-watchdog
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --check scripts/complete-lifecycle-watchdog-docs.mjs
      - run: node scripts/complete-lifecycle-watchdog-docs.mjs
      - name: Commit docs-only closeout
        run: |
          rm -f scripts/complete-lifecycle-watchdog-docs.mjs .github/workflows/complete-lifecycle-watchdog-docs.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: complete P0.12 lifecycle correctness"
          git push origin HEAD:fix/agent-lifecycle-watchdog
