name: P0.11a canonical fingerprint

on:
  push:
    branches:
      - perf/transcript-search-index
    paths:
      - scripts/add-p011a-index-fingerprint.mjs
      - .github/workflows/p011a-index-fingerprint.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/transcript-search-index
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/add-p011a-index-fingerprint.mjs
      - name: Verify and commit
        shell: bash
        run: |
          grep -F 'message_search_thread_state' server/message-search-index.ts
          grep -F 'canonicalFileFingerprint(messagesFile(threadId))' server/store.ts
          grep -F 'fingerprintMatches' server/message-search-index.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/message-search-index.ts server/store.ts
          git commit -m "fix: reconcile search index against canonical transcript fingerprints"
          git push origin HEAD:perf/transcript-search-index
