name: Harden busy steering delivery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/busy-user-steering' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/busy-user-steering
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --check scripts/harden-busy-steering.mjs
      - run: node scripts/harden-busy-steering.mjs
      - name: Commit hardened product diff
        run: |
          rm -f scripts/harden-busy-steering.mjs .github/workflows/harden-busy-steering.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make queued steering at-most-once across crashes"
          git push origin HEAD:feat/busy-user-steering
