name: Complete P0.11c docs

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/complete-p011c-docs.mjs
      - .github/workflows/complete-p011c-docs.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/global-transcript-search
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/complete-p011c-docs.mjs
      - name: Verify and commit
        shell: bash
        run: |
          grep -F -- '- [x] **P0.11 — Incremental transcript persistence and local search index.**' TODO.md
          grep -F 'global desktop transcript search' CHANGELOG.md
          grep -F 'one desktop search surface' README.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TODO.md CHANGELOG.md
          git commit -m "docs: complete P0.11 transcript persistence and search"
          git push origin HEAD:feat/global-transcript-search
