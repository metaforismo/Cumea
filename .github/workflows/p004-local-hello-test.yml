name: P0.04 local SSE test

on:
  push:
    branches:
      - perf/atomic-bootstrap-v2
    paths:
      - scripts/fix-p004-local-hello-test.mjs
      - .github/workflows/p004-local-hello-test.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/atomic-bootstrap-v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/fix-p004-local-hello-test.mjs
      - name: Verify and commit
        shell: bash
        run: |
          grep -F 'Number.isSafeInteger(localHello.eventCursor)' server/index.test.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.test.ts
          git commit -m "test: distinguish local SSE cursor hello"
          git push origin HEAD:perf/atomic-bootstrap-v2
