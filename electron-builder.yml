appId: io.github.metaforismo.cumea
productName: Cumea
artifactName: Cumea-${version}-${arch}.${ext}

directories:
  buildResources: build
  output: release

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  - "!electron/**/*.test.*"
  - "!electron/resources/speech-helper"
  - package.json

asar: true
asarUnpack:
  # Local computer use loads these native Node modules at runtime. Keeping
  # them unpacked lets Electron and the platform loader resolve .node/.dylib
  # files; the package smoke test asserts that they are present.
  - node_modules/@trycua/**
  - node_modules/@ubjs/**

extraResources:
  - from: dist
    to: ui
  - from: dist-server
    to: server
  # The compiled DOCX preview imports JSZip at runtime. Stage its exact,
  # lockfile-resolved dependency closure beside the server so Electron's Node
  # can resolve it on a clean installation.
  - from: build/server-runtime/node_modules
    to: server/node_modules
  - from: build/server-runtime/manifest.json
    to: server/runtime-manifest.json
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: licenses
    to: licenses

mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  # Electron consumes ICNS. It is generated from the user-approved rounded
  # macOS export; the Icon Composer document remains the editable Apple source.
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Cumea uses the microphone only while you dictate a message.
    NSSpeechRecognitionUsageDescription: Cumea uses Apple Speech Recognition to turn dictation into text. Apple may process audio online when on-device recognition is unavailable.
    NSScreenCaptureUsageDescription: Cumea captures the screen only when a local bot needs to see and interact with the interface you ask it to control.
    NSAppleEventsUsageDescription: Cumea uses Automation only when a requested local-computer action needs to communicate with another app.
  # Notarization runs manually after the build (notarytool + staple),
  # mirroring the BlueyLite ship_release.sh flow.
  notarize: false
  extraResources:
    - from: electron/resources/speech-helper
      to: speech-helper
    - from: build/cua-driver/darwin-arm64/cua-driver
      to: cua-driver

dmg:
  sign: true
  artifactName: Cumea-${version}.dmg

win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64

linux:
  target:
    - target: AppImage
      arch: x64
    - target: tar.gz
      arch: x64
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
